name: Online Boutique CI

on:
  push:
    branches:
      - devops
  pull_request:
    branches:
      - devops

permissions:
  contents: read
  packages: write
  pull-requests: read
  id-token: write

jobs:

  # ============================================================
  # 1. DETECT WHICH MICROSERVICES CHANGED
  # ============================================================

  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            adservice:
              - 'src/adservice/**'

            cartservice:
              - 'src/cartservice/**'

            checkoutservice:
              - 'src/checkoutservice/**'

            currencyservice:
              - 'src/currencyservice/**'

            emailservice:
              - 'src/emailservice/**'

            frontend:
              - 'src/frontend/**'

            loadgenerator:
              - 'src/loadgenerator/**'

            paymentservice:
              - 'src/paymentservice/**'

            productcatalogservice:
              - 'src/productcatalogservice/**'

            recommendationservice:
              - 'src/recommendationservice/**'

            shippingservice:
              - 'src/shippingservice/**'

            shoppingassistantservice:
              - 'src/shoppingassistantservice/**'

      - name: Show changed services
        run: |
          echo "Changed services:"
          echo '${{ steps.filter.outputs.changes }}' | jq .


  # ============================================================
  # 2. BUILD + PUSH ONLY CHANGED SERVICES
  # ============================================================

  build-and-push:
    name: Build ${{ matrix.service }}

    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Authenticate to Google Cloud using GitHub OIDC
      # --------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1034264155999/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: online-boutique-ci@avpn-dev-001.iam.gserviceaccount.com


      # --------------------------------------------------------
      # Configure gcloud
      # --------------------------------------------------------

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3


      # --------------------------------------------------------
      # Configure Docker for Artifact Registry
      # --------------------------------------------------------

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet


      # --------------------------------------------------------
      # Map service → Docker build context
      # --------------------------------------------------------

      - name: Set Docker build configuration
        id: config
        run: |
          case "${{ matrix.service }}" in

            adservice)
              echo "context=./src/adservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/adservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            cartservice)
              echo "context=./src/cartservice/src" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/cartservice/src/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            checkoutservice)
              echo "context=./src/checkoutservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/checkoutservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            currencyservice)
              echo "context=./src/currencyservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/currencyservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            emailservice)
              echo "context=./src/emailservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/emailservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            frontend)
              echo "context=./src/frontend" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/frontend/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            loadgenerator)
              echo "context=./src/loadgenerator" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/loadgenerator/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            paymentservice)
              echo "context=./src/paymentservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/paymentservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            productcatalogservice)
              echo "context=./src/productcatalogservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/productcatalogservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            recommendationservice)
              echo "context=./src/recommendationservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/recommendationservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            shippingservice)
              echo "context=./src/shippingservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/shippingservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            shoppingassistantservice)
              echo "context=./src/shoppingassistantservice" >> "$GITHUB_OUTPUT"
              echo "dockerfile=./src/shoppingassistantservice/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Unknown service: ${{ matrix.service }}"
              exit 1
              ;;

          esac


      # --------------------------------------------------------
      # Login to GHCR
      # --------------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Build image ONCE and tag for both registries
      # --------------------------------------------------------

      - name: Build Docker image
        run: |

          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/online-boutique-${{ matrix.service }}:${GITHUB_SHA}"

          GAR_IMAGE="us-central1-docker.pkg.dev/avpn-dev-001/online-boutique/${{ matrix.service }}:${GITHUB_SHA}"

          echo "======================================"
          echo "Service: ${{ matrix.service }}"
          echo "Context: ${{ steps.config.outputs.context }}"
          echo "Dockerfile: ${{ steps.config.outputs.dockerfile }}"
          echo "GHCR: $GHCR_IMAGE"
          echo "GAR:  $GAR_IMAGE"
          echo "======================================"

          docker build \
            -f "${{ steps.config.outputs.dockerfile }}" \
            -t "$GHCR_IMAGE" \
            -t "$GAR_IMAGE" \
            "${{ steps.config.outputs.context }}"


      # --------------------------------------------------------
      # Push to BOTH registries
      # --------------------------------------------------------

      - name: Push Docker images
        if: github.event_name == 'push'
        run: |

          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/online-boutique-${{ matrix.service }}:${GITHUB_SHA}"

          GAR_IMAGE="us-central1-docker.pkg.dev/avpn-dev-001/online-boutique/${{ matrix.service }}:${GITHUB_SHA}"

          echo "======================================"
          echo "Pushing to GHCR"
          echo "$GHCR_IMAGE"
          echo "======================================"

          docker push "$GHCR_IMAGE"

          echo "======================================"
          echo "Pushing to Artifact Registry"
          echo "$GAR_IMAGE"
          echo "======================================"

          docker push "$GAR_IMAGE"


  # ============================================================
  # 3. UPDATE ONLY CHANGED SERVICES IN GITOPS
  # ============================================================

  update-gitops:
    name: Update GitOps repository

    needs:
      - detect-changes
      - build-and-push

    if: github.event_name == 'push' &&
        needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout GitOps repository
      # --------------------------------------------------------

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: prithvi-A24/k8s-argocd-docker-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops


      # --------------------------------------------------------
      # Update only affected image tags
      # --------------------------------------------------------

      - name: Update changed image tags
        working-directory: gitops

        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
          SHA: ${{ github.sha }}

        run: |

          echo "======================================"
          echo "Updating GitOps"
          echo "Commit SHA: $SHA"
          echo "Changed services:"
          echo "$CHANGED_SERVICES" | jq .
          echo "======================================"

          python3 <<'PY'

          import json
          import os
          import re

          path = "overlays/minikube/kustomization.yaml"

          with open(path, "r") as f:
              content = f.read()

          services = json.loads(
              os.environ["CHANGED_SERVICES"]
          )

          sha = os.environ["SHA"]

          for service in services:

              image_name = (
                  f"ghcr.io/prithvi-a24/"
                  f"online-boutique-{service}"
              )

              pattern = (
                  rf"(newName:\s+{re.escape(image_name)}\s*\n"
                  rf"\s+newTag:\s*)[^\n]+"
              )

              replacement = rf"\g<1>{sha}"

              updated_content, count = re.subn(
                  pattern,
                  replacement,
                  content
              )

              if count == 0:

                  print(
                      f"WARNING: No GitOps image mapping found "
                      f"for {service}"
                  )

              else:

                  print(
                      f"Updated {service} -> {sha}"
                  )

              content = updated_content

          with open(path, "w") as f:
              f.write(content)

          PY


      # --------------------------------------------------------
      # Verify GitOps configuration
      # --------------------------------------------------------

      - name: Verify GitOps configuration
        working-directory: gitops
        run: |

          echo "Git diff:"

          git diff -- \
            overlays/minikube/kustomization.yaml


      # --------------------------------------------------------
      # Commit and push GitOps change
      # --------------------------------------------------------

      - name: Commit and push GitOps change
        working-directory: gitops
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            overlays/minikube/kustomization.yaml

          if git diff --cached --quiet; then

            echo "No GitOps changes to commit."

            exit 0

          fi

          git commit \
            -m "Update changed Online Boutique images to ${GITHUB_SHA}"

          git push origin main