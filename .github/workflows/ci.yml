name: Online Boutique CI

on:
  push:
    branches:
      - devops
  pull_request:
    branches:
      - devops

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: ./src/adservice
            dockerfile: ./src/adservice/Dockerfile

          - service: cartservice
            context: ./src/cartservice/src
            dockerfile: ./src/cartservice/src/Dockerfile

          - service: checkoutservice
            context: ./src/checkoutservice
            dockerfile: ./src/checkoutservice/Dockerfile

          - service: currencyservice
            context: ./src/currencyservice
            dockerfile: ./src/currencyservice/Dockerfile

          - service: emailservice
            context: ./src/emailservice
            dockerfile: ./src/emailservice/Dockerfile

          - service: frontend
            context: ./src/frontend
            dockerfile: ./src/frontend/Dockerfile

          - service: loadgenerator
            context: ./src/loadgenerator
            dockerfile: ./src/loadgenerator/Dockerfile

          - service: paymentservice
            context: ./src/paymentservice
            dockerfile: ./src/paymentservice/Dockerfile

          - service: productcatalogservice
            context: ./src/productcatalogservice
            dockerfile: ./src/productcatalogservice/Dockerfile

          - service: recommendationservice
            context: ./src/recommendationservice
            dockerfile: ./src/recommendationservice/Dockerfile

          - service: shippingservice
            context: ./src/shippingservice
            dockerfile: ./src/shippingservice/Dockerfile

          - service: shoppingassistantservice
            context: ./src/shoppingassistantservice
            dockerfile: ./src/shoppingassistantservice/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/online-boutique-${{ matrix.service }}:${GITHUB_SHA}"

          echo "Building: $IMAGE"

          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "$IMAGE" \
            "${{ matrix.context }}"

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/online-boutique-${{ matrix.service }}:${GITHUB_SHA}"

          echo "Pushing: $IMAGE"

          docker push "$IMAGE"

  update-gitops:
    name: Update GitOps repository
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: prithvi-A24/k8s-argocd-docker-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tags
        working-directory: gitops
        run: |
          SHA="${GITHUB_SHA}"

          sed -i "s#newTag: .*#newTag: ${SHA}#g" overlays/minikube/kustomization.yaml

          echo "Updated GitOps image tag to:"
          echo "$SHA"

      - name: Verify GitOps configuration
        working-directory: gitops
        run: |
          git diff -- overlays/minikube/kustomization.yaml

      - name: Commit and push GitOps change
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add overlays/minikube/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "Update Online Boutique images to ${GITHUB_SHA}"
          git push origin main