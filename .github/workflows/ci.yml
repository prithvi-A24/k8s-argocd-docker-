name: Frontend CI

on:
  push:
    branches:
      - devops
  pull_request:
    branches:
      - devops

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/online-boutique-frontend:${{ github.sha }} \
            ./src/frontend

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/online-boutique-frontend:${{ github.sha }}
